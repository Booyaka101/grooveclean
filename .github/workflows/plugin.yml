name: VST3 prototype

on:
  pull_request:
    paths: ["plugin/**", "src/grooveclean/**", "tests/test_plugin_*.py", "pyproject.toml", ".github/workflows/plugin.yml"]
  push:
    branches: [main]
    paths: ["plugin/**", "src/grooveclean/**", "tests/test_plugin_*.py", "pyproject.toml", ".github/workflows/plugin.yml"]
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: cmake -S plugin -B build/plugin -DGROOVECLEAN_BUILD_VST3=OFF
      - run: cmake --build build/plugin --parallel 2
      - run: ctest --test-dir build/plugin --output-on-failure

  vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
          path: build/vst3sdk
      - name: SDK submodules
        working-directory: build/vst3sdk
        run: git submodule update --init --depth 1 base cmake pluginterfaces public.sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU worker
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r plugin/preview/requirements.txt
          python -m pip install -e ".[dev]"
      - name: Configure
        run: cmake -S plugin -B build/plugin -A x64 -DVST3_SDK_ROOT="${{ github.workspace }}/build/vst3sdk"
      - name: Build and SDK validation
        run: cmake --build build/plugin --config Release --parallel 2
      - name: Native and worker integration tests
        shell: pwsh
        run: |
          $env:GROOVECLEAN_PYTHON = (Get-Command python).Source
          ctest --test-dir build/plugin -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_plugin_worker.py tests/test_plugin_quality.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build preview worker wheel
        run: python -m pip wheel --no-deps . --wheel-dir build/plugin-python
      - name: Package and test isolated preview runtime
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem build/plugin-python/*.whl).FullName
          python plugin/preview/build_package.py --bundle build/plugin/VST3/Release/GrooveClean.vst3 --wheel $wheel --sdk-license build/vst3sdk/LICENSE.txt --output build/preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/preview/GrooveClean-VST3-Windows-x64-preview/Setup.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GrooveClean-VST3-Windows-experimental
          path: |
            build/preview/*.zip
            build/preview/*.sha256
          if-no-files-found: error
